<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}Overview{% endblock %} | AI SDR</title>
<style>
:root{--bg:#101419;--panel:#191f27;--line:#303a47;--muted:#a9b5c4;--text:#f1f4f8;--accent:#90e0c0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}a{color:var(--accent)}.topbar{padding:18px 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:32px;flex-wrap:wrap}.brand{font-weight:750;font-size:19px;color:white;text-decoration:none}.topbar nav{display:flex;gap:24px}.topbar nav a{text-decoration:none;color:var(--muted)}main{max-width:1240px;margin:auto;padding:38px 28px}h1{font-size:32px;letter-spacing:-1px;margin:0}h2{font-size:19px;margin:0 0 8px}h3{font-size:16px;margin:0}p{margin:8px 0;overflow-wrap:anywhere}.muted{color:var(--muted)}.heading,.row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.heading{margin-bottom:28px}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.button,button{display:inline-block;background:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:10px 16px;color:#10241c;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}.secondary{background:transparent;border-color:var(--line);color:var(--text)}button:disabled{opacity:.45;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}.stat strong{font-size:30px;display:block}.stat span{color:var(--muted)}.columns{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}.panel{margin-bottom:22px}.item{padding:18px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.badge{display:inline-block;font-size:12px;border-radius:6px;padding:3px 8px;background:#26383c;color:#a7e2d4}.warning{color:#ffce8c}.error{padding:14px;background:#452d2e;border:1px solid #b77676;border-radius:8px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}td{max-width:300px;overflow-wrap:anywhere}th{color:var(--muted)}label{display:block;margin:14px 0 6px}input,select{padding:11px;background:#101419;color:white;border:1px solid #626f80;border-radius:6px;font:inherit;max-width:100%}select{width:100%}.upload{border:1px dashed #647889;padding:30px;border-radius:12px;margin:20px 0}.steps{color:var(--muted);margin:0 0 24px}a:focus-visible,button:focus-visible{outline:2px solid white;outline-offset:4px}@media(max-width:760px){.columns{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}main{padding:24px 18px}.topbar{gap:16px}.topbar nav{gap:16px}}
</style></head><body><header class="topbar"><a class="brand" href="/">AI SDR</a><nav aria-label="Main navigation"><a href="/">Overview</a><a href="/replies">Replies</a><a href="{{ url_for('dashboard.outreach_queue') }}">Review drafts</a><a href="{{ url_for('imports.upload') }}">Import leads</a></nav></header><main>{% block content %}{% endblock %}</main></body></html>
